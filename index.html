<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="description" content="PureView — a minimal AR heads-up display for wearable glasses. Pronounced purview.">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PureView">
<title>PureView</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }

  :root {
    --cyan:       #00E5FF;
    --cyan-dim:   rgba(0,229,255,0.55);
    --cyan-faint: rgba(0,229,255,0.10);
    --warn:       #FF6B35;
    --panel:      rgba(0,0,0,0.54);
    --border:     rgba(0,229,255,0.25);
    --text:       rgba(0,229,255,0.92);
    --text-dim:   rgba(0,229,255,0.42);
    --font:       'Courier New', monospace;
  }

  html, body {
    width:100%; height:100%;
    background: transparent;
    overflow:hidden;
    font-family: var(--font);
    color: var(--text);
  }

  /* scanline atmosphere */
  body::before {
    content:'';
    position:fixed; inset:0;
    background: repeating-linear-gradient(
      0deg, transparent, transparent 3px,
      rgba(0,229,255,0.016) 3px, rgba(0,229,255,0.016) 4px
    );
    pointer-events:none; z-index:9000;
  }

  /* ── HUD GRID ── */
  #hud {
    position:fixed; inset:0;
    display:grid;
    grid-template-columns: auto 1fr auto;
    grid-template-rows: auto 1fr auto;
    padding: 12px 16px;
  }

  /* ── Shared panel ── */
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 6px 10px;
    backdrop-filter: blur(6px);
  }

  .lbl {
    font-size:7.5px; letter-spacing:.18em;
    color:var(--text-dim); text-transform:uppercase;
    display:block; margin-bottom:2px;
  }
  .val   { font-size:15px; font-weight:bold; line-height:1; letter-spacing:.04em; }
  .val-sm{ font-size:11px; line-height:1.35; letter-spacing:.03em; }

  /* ── TOP LEFT: compass ── */
  #top-left { grid-column:1; grid-row:1; align-self:start; }
  #compass-panel { display:flex; align-items:center; gap:10px; }

  #tape-wrap {
    width:80px; height:26px;
    overflow:hidden; position:relative;
  }
  #tape-svg { position:absolute; left:0; top:0; width:800px; height:26px; }
  #tape-cursor {
    position:absolute; left:50%; top:0;
    transform:translateX(-50%);
    width:1.5px; height:100%;
    background: var(--cyan);
    pointer-events:none;
  }

  #dir-big {
    font-size:28px; font-weight:bold;
    line-height:1; letter-spacing:-.02em;
    text-shadow: 0 0 12px var(--cyan);
  }
  #hdg-deg { font-size:10px; color:var(--text-dim); letter-spacing:.1em; }

  /* ── TOP CENTER: temp ── */
  #top-center {
    grid-column:2; grid-row:1;
    display:flex; justify-content:center; align-items:flex-start;
    padding-top:2px;
  }
  #temp-panel { display:flex; align-items:baseline; gap:5px; }
  #temp-val   { font-size:18px; font-weight:bold; }
  #temp-unit  { font-size:10px; color:var(--text-dim); }

  /* ── TOP RIGHT: clock ── */
  #top-right {
    grid-column:3; grid-row:1;
    display:flex; flex-direction:column; align-items:flex-end; gap:5px;
  }
  #time-panel { text-align:right; }
  #clock      { font-size:26px; font-weight:bold; letter-spacing:.06em; line-height:1; text-shadow:0 0 10px var(--cyan); }
  #date-str   { font-size:9px; color:var(--text-dim); letter-spacing:.12em; margin-top:2px; }

  /* ── MIDDLE (empty) ── */
  #mid-left  { grid-column:1; grid-row:2; }
  #mid-center{ grid-column:2; grid-row:2; }
  #mid-right { grid-column:3; grid-row:2; }

  /* ── BOTTOM LEFT: camera ── */
  #bottom-left {
    grid-column:1; grid-row:3;
    display:flex; flex-direction:column; align-items:flex-start; gap:3px;
    align-self:end;
  }
  #cam-wrapper {
    position:relative; width:128px; height:96px;
    border:1px solid var(--border); border-radius:3px;
    overflow:hidden; background:#000;
  }
  #cam-feed { width:100%; height:100%; object-fit:cover; display:block; }
  #cam-wrapper::before, #cam-wrapper::after {
    content:''; position:absolute;
    width:9px; height:9px;
    border-color:var(--cyan); border-style:solid; opacity:.7; z-index:2;
  }
  #cam-wrapper::before { top:3px; left:3px;   border-width:1.5px 0 0 1.5px; }
  #cam-wrapper::after  { bottom:3px; right:3px; border-width:0 1.5px 1.5px 0; }
  #cam-status {
    position:absolute; top:4px; right:6px;
    font-size:7px; letter-spacing:.1em; color:var(--cyan); z-index:3;
  }
  #cam-status.offline { color:var(--warn); }
  #cam-label { font-size:7px; letter-spacing:.2em; color:var(--text-dim); text-transform:uppercase; }

  /* ── BOTTOM CENTER: speed ── */
  #bottom-center {
    grid-column:2; grid-row:3;
    display:flex; justify-content:center; align-items:flex-end; padding-bottom:1px;
  }
  #speed-val   { font-size:32px; font-weight:bold; letter-spacing:-.02em; text-shadow:0 0 14px var(--cyan); }
  #speed-unit  { font-size:10px; color:var(--text-dim); letter-spacing:.12em; }
  #speed-inner { display:flex; align-items:baseline; gap:4px; }

  /* ── BOTTOM RIGHT: map + location + elev ── */
  #bottom-right {
    grid-column:3; grid-row:3;
    display:flex; flex-direction:column; align-items:flex-end; gap:5px;
    align-self:end;
  }

  #map-panel {
    position:relative;
    width:200px; height:150px;
    border:1px solid var(--border); border-radius:3px;
    overflow:hidden; background:#0a0f0f;
    cursor:pointer;
  }
  #map { width:100%; height:100%; }

  #map-panel::after {
    content:'';
    position:absolute; inset:0;
    background: linear-gradient(
      to bottom,
      rgba(0,229,255,0.04) 0%,
      transparent 40%,
      rgba(0,0,0,0.18) 100%
    );
    pointer-events:none; z-index:500;
  }

  .map-corner {
    position:absolute; width:9px; height:9px;
    border-color:var(--cyan); border-style:solid; opacity:.65; z-index:600;
    pointer-events:none;
  }
  .mc-tl { top:3px;    left:3px;  border-width:1.5px 0 0 1.5px; }
  .mc-br { bottom:3px; right:3px; border-width:0 1.5px 1.5px 0; }

  #map-mode {
    position:absolute; bottom:5px; left:6px;
    font-size:7px; letter-spacing:.15em; color:var(--cyan);
    text-transform:uppercase; z-index:600;
    background:rgba(0,0,0,0.55); padding:1px 4px; border-radius:2px;
    pointer-events:none;
  }

  #map-crosshair {
    position:absolute; top:50%; left:50%;
    transform:translate(-50%,-50%);
    width:10px; height:10px; z-index:600; pointer-events:none;
  }
  #map-crosshair::before, #map-crosshair::after {
    content:''; position:absolute; background:var(--cyan); opacity:.9;
  }
  #map-crosshair::before { width:1px; height:100%; left:50%; transform:translateX(-50%); top:0; }
  #map-crosshair::after  { height:1px; width:100%; top:50%; transform:translateY(-50%); left:0; }

  #loc-panel { text-align:right; }
  #loc-neighborhood { font-size:13px; font-weight:bold; line-height:1; letter-spacing:.02em; }
  #loc-city { font-size:9px; color:var(--text-dim); letter-spacing:.1em; margin-top:2px; }

  #elev-panel { text-align:right; }

  .live-dot {
    display:inline-block; width:5px; height:5px; border-radius:50%;
    background:var(--cyan); margin-right:4px;
    animation:pulse 2s ease-in-out infinite; vertical-align:middle;
  }
  @keyframes pulse {
    0%,100%{ opacity:1; box-shadow:0 0 4px var(--cyan); }
    50%    { opacity:.3; box-shadow:none; }
  }

  .leaflet-control-zoom,
  .leaflet-control-attribution { display:none !important; }
  .leaflet-tile { filter: brightness(0.72) saturate(0.5) hue-rotate(155deg); }

  /* ── Init screen ── */
  #perm-overlay {
    position:fixed; inset:0;
    background:#000;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    gap:16px; z-index:9999;
    text-align:center; padding:32px;
  }

  #pv-wordmark {
    font-size:28px; font-weight:bold;
    letter-spacing:.35em; text-transform:uppercase;
    text-shadow: 0 0 24px var(--cyan);
    margin-bottom:4px;
  }

  #pv-sub {
    font-size:9px; letter-spacing:.25em;
    color:var(--text-dim); text-transform:uppercase;
    margin-top:-10px;
  }

  #perm-overlay p {
    font-size:10px; color:var(--text-dim);
    max-width:260px; line-height:1.8; letter-spacing:.06em;
    border-top:1px solid var(--border);
    padding-top:14px;
  }

  #perm-btn {
    background:none; border:1px solid var(--cyan);
    color:var(--cyan); font-family:var(--font); font-size:11px;
    letter-spacing:.25em; text-transform:uppercase;
    padding:11px 28px; cursor:pointer; border-radius:3px;
    margin-top:4px;
    transition: background .15s, box-shadow .15s;
  }
  #perm-btn:active {
    background:var(--cyan-faint);
    box-shadow: 0 0 12px rgba(0,229,255,0.3);
  }

  #perm-err { font-size:9px; color:var(--warn); letter-spacing:.1em; margin-top:4px; }
</style>
</head>
<body>

<div id="perm-overlay">
  <div id="pv-wordmark">PureView</div>
  <div id="pv-sub">pronounced purview</div>
  <p>Requires camera, location, and motion sensor access.<br>Use in landscape mode.</p>
  <button id="perm-btn" onclick="initHUD()">Initialize</button>
  <div id="perm-err" style="display:none;"></div>
</div>

<div id="hud" style="display:none;">

  <!-- TOP LEFT: Compass -->
  <div id="top-left">
    <div class="panel" id="compass-panel">
      <div id="tape-wrap">
        <svg id="tape-svg" viewBox="0 0 800 26" xmlns="http://www.w3.org/2000/svg"></svg>
        <div id="tape-cursor"></div>
      </div>
      <div>
        <div class="lbl">HDG</div>
        <div id="dir-big">N</div>
        <div id="hdg-deg">000°</div>
      </div>
    </div>
  </div>

  <!-- TOP CENTER: Temp -->
  <div id="top-center">
    <div class="panel" id="temp-panel">
      <span class="lbl">AMBIENT</span>
      <span id="temp-val" class="val">--</span>
      <span id="temp-unit">°F</span>
    </div>
  </div>

  <!-- TOP RIGHT: Clock -->
  <div id="top-right">
    <div class="panel" id="time-panel">
      <div class="lbl">LOCAL TIME</div>
      <div id="clock">--:--:--</div>
      <div id="date-str">--- -- ----</div>
    </div>
  </div>

  <div id="mid-left"></div>
  <div id="mid-center"></div>
  <div id="mid-right"></div>

  <!-- BOTTOM LEFT: Camera -->
  <div id="bottom-left">
    <div id="cam-wrapper">
      <video id="cam-feed" autoplay playsinline muted></video>
      <div id="cam-status" class="offline">NO FEED</div>
    </div>
    <div id="cam-label">
      <span class="live-dot" id="cam-dot" style="display:none;"></span>CAM · REAR
    </div>
  </div>

  <!-- BOTTOM CENTER: Speed -->
  <div id="bottom-center">
    <div class="panel">
      <div class="lbl">SPEED</div>
      <div id="speed-inner">
        <span id="speed-val" class="val">0</span>
        <span id="speed-unit">MPH</span>
      </div>
    </div>
  </div>

  <!-- BOTTOM RIGHT: Map + Location + Elev -->
  <div id="bottom-right">
    <div id="map-panel" onclick="toggleMapMode()">
      <div id="map"></div>
      <div class="map-corner mc-tl"></div>
      <div class="map-corner mc-br"></div>
      <div id="map-crosshair"></div>
      <div id="map-mode">STREET</div>
    </div>
    <div class="panel" id="loc-panel">
      <div class="lbl">LOCATION</div>
      <div id="loc-neighborhood" class="val">LOCATING…</div>
      <div id="loc-city">---</div>
    </div>
    <div class="panel" id="elev-panel">
      <div class="lbl">ELEVATION</div>
      <div id="elev-val" class="val">-- ft</div>
    </div>
  </div>

</div>

<script>
const MS_TO_MPH = 2.23694;
const M_TO_FT   = 3.28084;
let map, marker, streetLayer, satLayer;
let mapMode = 'street';
let lastGeocode = 0;
let weatherFetched = false;

// ── Clock ──────────────────────────────────────
function updateClock() {
  const n = new Date(), p = v => String(v).padStart(2,'0');
  document.getElementById('clock').textContent =
    `${p(n.getHours())}:${p(n.getMinutes())}:${p(n.getSeconds())}`;
  const D=['SUN','MON','TUE','WED','THU','FRI','SAT'];
  const M=['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];
  document.getElementById('date-str').textContent =
    `${D[n.getDay()]} ${p(n.getDate())} ${M[n.getMonth()]} ${n.getFullYear()}`;
}
setInterval(updateClock, 1000);
updateClock();

// ── Compass tape ───────────────────────────────
(function buildTape() {
  const LABELS = ['N','NE','E','SE','S','SW','W','NW'];
  const STEP = 50;
  const svg = document.getElementById('tape-svg');
  for (let cycle = 0; cycle < 3; cycle++) {
    LABELS.forEach((lbl, i) => {
      const tx = cycle * LABELS.length * STEP + i * STEP + 25;
      const line = document.createElementNS('http://www.w3.org/2000/svg','line');
      line.setAttribute('x1',tx); line.setAttribute('y1',18);
      line.setAttribute('x2',tx); line.setAttribute('y2',26);
      line.setAttribute('stroke', lbl==='N' ? '#00E5FF' : 'rgba(0,229,255,0.35)');
      line.setAttribute('stroke-width', lbl==='N' ? '2' : '1');
      svg.appendChild(line);
      const text = document.createElementNS('http://www.w3.org/2000/svg','text');
      text.setAttribute('x',tx); text.setAttribute('y',13);
      text.setAttribute('text-anchor','middle');
      text.setAttribute('font-family','Courier New');
      text.setAttribute('font-size', lbl==='N' ? '9' : '7');
      text.setAttribute('fill', lbl==='N' ? 'rgba(0,229,255,0.95)' : 'rgba(0,229,255,0.45)');
      text.textContent = lbl;
      svg.appendChild(text);
    });
  }
})();

function updateCompass(deg) {
  const DIRS = ['N','NE','E','SE','S','SW','W','NW'];
  document.getElementById('dir-big').textContent = DIRS[Math.round(deg/45)%8];
  document.getElementById('hdg-deg').textContent = String(Math.round(deg)).padStart(3,'0')+'°';
  const wrapWidth = 80;
  const totalOffset = 400 - (wrapWidth/2) + deg * (50/45);
  document.getElementById('tape-svg').style.left = `-${totalOffset}px`;
}
updateCompass(0);

// ── Orientation ────────────────────────────────
function initOrientation() {
  if (typeof DeviceOrientationEvent !== 'undefined' &&
      typeof DeviceOrientationEvent.requestPermission === 'function') {
    DeviceOrientationEvent.requestPermission()
      .then(r => { if (r==='granted') bindOrientation(); })
      .catch(() => {});
  } else {
    bindOrientation();
  }
}

function bindOrientation() {
  const evt = 'ondeviceorientationabsolute' in window
    ? 'deviceorientationabsolute' : 'deviceorientation';
  window.addEventListener(evt, e => {
    let deg = null;
    if (e.webkitCompassHeading != null) deg = e.webkitCompassHeading;
    else if (e.alpha != null) deg = (360 - e.alpha) % 360;
    if (deg !== null) updateCompass(deg);
  }, true);
}

// ── Map ────────────────────────────────────────
function initMap() {
  map = L.map('map', {
    zoomControl:false, attributionControl:false,
    dragging:false, touchZoom:false, scrollWheelZoom:false,
    doubleClickZoom:false, keyboard:false, tap:false, zoom:16
  });

  streetLayer = L.tileLayer(
    'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',
    { maxZoom:19 }
  ).addTo(map);

  satLayer = L.tileLayer(
    'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
    { maxZoom:19 }
  );

  map.setView([0,0], 16);

  marker = L.marker([0,0], {
    icon: L.divIcon({
      html:`<div style="width:10px;height:10px;border-radius:50%;background:rgba(0,229,255,0.9);box-shadow:0 0 0 3px rgba(0,229,255,0.25),0 0 8px rgba(0,229,255,0.6);"></div>`,
      iconSize:[10,10], iconAnchor:[5,5], className:''
    })
  }).addTo(map);
}

function toggleMapMode() {
  if (mapMode==='street') {
    mapMode='sat';
    map.removeLayer(streetLayer);
    satLayer.addTo(map);
    document.getElementById('map-mode').textContent='SAT';
    document.querySelectorAll('.leaflet-tile').forEach(t =>
      t.style.filter='brightness(0.8) saturate(0.7)'
    );
  } else {
    mapMode='street';
    map.removeLayer(satLayer);
    streetLayer.addTo(map);
    document.getElementById('map-mode').textContent='STREET';
    document.querySelectorAll('.leaflet-tile').forEach(t =>
      t.style.filter='brightness(0.72) saturate(0.5) hue-rotate(155deg)'
    );
  }
}

function updateMap(lat, lon) {
  const ll = L.latLng(lat, lon);
  map.setView(ll, map.getZoom(), { animate:true, duration:0.8 });
  marker.setLatLng(ll);
}

// ── Reverse geocode ────────────────────────────
async function reverseGeocode(lat, lon) {
  const now = Date.now();
  if (now - lastGeocode < 10000) return;
  lastGeocode = now;
  try {
    const res = await fetch(
      `https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lon}&format=json&zoom=14`,
      { headers:{ 'Accept-Language':'en' } }
    );
    const data = await res.json();
    const a = data.address || {};
    const hood = a.neighbourhood||a.suburb||a.quarter||a.residential||a.village||a.town||a.hamlet||'—';
    const city = a.city||a.county||a.state_district||a.state||'—';
    document.getElementById('loc-neighborhood').textContent = hood.toUpperCase();
    document.getElementById('loc-city').textContent = city.toUpperCase();
  } catch(e) {}
}

// ── Weather ────────────────────────────────────
async function fetchWeather(lat, lon) {
  try {
    const res = await fetch(
      `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m&temperature_unit=fahrenheit&forecast_days=1`
    );
    const data = await res.json();
    document.getElementById('temp-val').textContent =
      Math.round(data.current.temperature_2m);
  } catch(e) {}
}

// ── Geolocation ────────────────────────────────
function initGeo() {
  if (!navigator.geolocation) return;
  navigator.geolocation.watchPosition(pos => {
    const { latitude:lat, longitude:lon, altitude, speed } = pos.coords;
    document.getElementById('speed-val').textContent =
      speed !== null ? Math.round(speed * MS_TO_MPH) : '0';
    if (altitude !== null)
      document.getElementById('elev-val').textContent =
        `${Math.round(altitude * M_TO_FT)} ft`;
    updateMap(lat, lon);
    reverseGeocode(lat, lon);
    if (!weatherFetched) { weatherFetched=true; fetchWeather(lat, lon); }
  }, () => {}, { enableHighAccuracy:true, maximumAge:1000, timeout:15000 });
}

// ── Camera ─────────────────────────────────────
async function initCamera() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video:{ facingMode:{ ideal:'environment' }, width:320, height:240 },
      audio:false
    });
    document.getElementById('cam-feed').srcObject = stream;
    document.getElementById('cam-status').textContent = 'LIVE';
    document.getElementById('cam-status').classList.remove('offline');
    document.getElementById('cam-dot').style.display = 'inline-block';
  } catch(e) {
    document.getElementById('cam-status').textContent = 'NO FEED';
  }
}

// ── Wake lock ──────────────────────────────────
async function wakeLock() {
  try { if ('wakeLock' in navigator) await navigator.wakeLock.request('screen'); } catch(e) {}
}

// ── Init ───────────────────────────────────────
async function initHUD() {
  const btn = document.getElementById('perm-btn');
  btn.textContent = 'Initializing…';
  btn.disabled = true;
  try {
    document.getElementById('perm-overlay').style.display = 'none';
    document.getElementById('hud').style.display = 'grid';
    initMap();
    await initCamera();
    initGeo();
    initOrientation();
    wakeLock();
    try {
      if (document.documentElement.requestFullscreen)
        await document.documentElement.requestFullscreen();
      if (screen.orientation && screen.orientation.lock)
        await screen.orientation.lock('landscape').catch(()=>{});
    } catch(e) {}
  } catch(e) {
    document.getElementById('perm-overlay').style.display = 'flex';
    const err = document.getElementById('perm-err');
    err.style.display = 'block';
    err.textContent = 'Error: ' + e.message;
    btn.textContent = 'Retry';
    btn.disabled = false;
  }
}
</script>
</body>
</html>
